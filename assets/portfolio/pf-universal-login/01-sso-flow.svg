<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="ulogin 리다이렉트 SSO 3단계 교환 플로우 — validate, authorize, exchange">
  <defs>
    <linearGradient id="ul-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1030"/>
      <stop offset="0.55" stop-color="#131a4a"/>
      <stop offset="1" stop-color="#1b2570"/>
    </linearGradient>
    <linearGradient id="ul-wire" gradientUnits="userSpaceOnUse" x1="185" y1="0" x2="600" y2="0">
      <stop offset="0" stop-color="#4f7bff"/>
      <stop offset="1" stop-color="#8ad8ff"/>
    </linearGradient>
    <marker id="ul-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8ad8ff"/>
    </marker>
    <marker id="ul-ar-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#7ff0c0"/>
    </marker>
  </defs>

  <rect width="1200" height="675" fill="url(#ul-bg)"/>

  <g stroke="#3a4790" stroke-width="1" opacity="0.2">
    <path d="M0 135 H1200 M0 270 H1200 M0 405 H1200 M0 540 H1200"/>
    <path d="M200 0 V675 M400 0 V675 M600 0 V675 M800 0 V675 M1000 0 V675"/>
  </g>

  <g font-family="'Segoe UI','Noto Sans KR',sans-serif">
    <text x="60" y="60" font-size="30" font-weight="700" fill="#ffffff">리다이렉트 SSO — 3단계 교환</text>
    <text x="60" y="88" font-size="16" fill="#aeb9f0">시크릿은 URL로 가지 않는다. URL에는 60초짜리 1회용 code만 실린다</text>

    <!-- lane headers -->
    <g>
      <rect x="60" y="118" width="250" height="52" rx="12" fill="#1b2570" stroke="#8ad8ff" stroke-width="2"/>
      <text x="185" y="143" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">로컬 HTML / AI 앱</text>
      <text x="185" y="161" text-anchor="middle" font-size="13" fill="#8ad8ff">키를 담지 않은 정적 파일</text>
    </g>
    <g>
      <rect x="470" y="118" width="260" height="52" rx="12" fill="#242f80" stroke="#aebcff" stroke-width="2"/>
      <text x="600" y="143" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">ulogin 서버</text>
      <text x="600" y="161" text-anchor="middle" font-size="13" fill="#aebcff">PHP 7.2+ · MySQL · 의존성 0</text>
    </g>
    <g>
      <rect x="890" y="118" width="250" height="52" rx="12" fill="#123c46" stroke="#7ff0c0" stroke-width="2"/>
      <text x="1015" y="143" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">AI 제공자 API</text>
      <text x="1015" y="161" text-anchor="middle" font-size="13" fill="#7ff0c0">앱이 직접 호출한다</text>
    </g>

    <!-- lifelines -->
    <g stroke="#5566bb" stroke-width="2" stroke-dasharray="6 7" opacity="0.75">
      <path d="M185 170 V600"/>
      <path d="M600 170 V600"/>
      <path d="M1015 170 V600"/>
    </g>

    <!-- step 1 validate -->
    <g stroke="url(#ul-wire)" stroke-width="3" fill="none">
      <path d="M185 216 H592" marker-end="url(#ul-ar)"/>
    </g>
    <text x="200" y="207" font-size="15" fill="#e6ecff">① sso/validate.php — service_id · redirect_uri</text>
    <text x="200" y="238" font-size="13" fill="#8ad8ff">redirect_whitelist 완전 일치 검사. 리다이렉트 전에 끝낸다</text>

    <!-- step 2 authorize -->
    <g stroke="url(#ul-wire)" stroke-width="3" fill="none">
      <path d="M185 296 H592" marker-end="url(#ul-ar)"/>
    </g>
    <text x="200" y="287" font-size="15" fill="#e6ecff">② sso/authorize.php — 자격증명 + code_challenge (S256)</text>
    <text x="200" y="318" font-size="13" fill="#8ad8ff">레이트리밋 · 계정 락아웃 · state 생성</text>

    <!-- code back -->
    <g stroke="url(#ul-wire)" stroke-width="3" fill="none">
      <path d="M593 366 H193" marker-end="url(#ul-ar)"/>
    </g>
    <text x="200" y="357" font-size="15" fill="#e6ecff">③ 복귀 — callback.html?code=…&amp;state=…</text>
    <text x="200" y="388" font-size="13" fill="#8ad8ff">1회용 code · TTL 60초. 시크릿은 여기에 없다</text>

    <!-- step 4 exchange -->
    <g stroke="url(#ul-wire)" stroke-width="3" fill="none">
      <path d="M185 446 H592" marker-end="url(#ul-ar)"/>
    </g>
    <text x="200" y="437" font-size="15" fill="#e6ecff">④ auth/exchange.php — POST 본문에 code + code_verifier</text>
    <text x="200" y="468" font-size="13" fill="#8ad8ff">code 1회 소비 · PKCE 검증 · 3축 등급 판정 → payload 조립</text>

    <!-- payload back -->
    <g stroke="url(#ul-wire)" stroke-width="3" fill="none">
      <path d="M593 516 H193" marker-end="url(#ul-ar)"/>
    </g>
    <text x="200" y="507" font-size="15" fill="#e6ecff">⑤ 200 { user, session, payload }</text>
    <text x="200" y="538" font-size="13" fill="#8ad8ff">등급이 모자란 시크릿은 에러 없이 조용히 생략된다</text>

    <!-- to AI -->
    <path d="M622 592 H1005" stroke="#7ff0c0" stroke-width="3.5" fill="none" marker-end="url(#ul-ar-g)"/>
    <text x="640" y="572" font-size="15" fill="#d8ffef">⑥ payload.ai_api_key 로 직접 호출 · 호출마다 포인트 차감</text>

    <!-- memory-only callout -->
    <g>
      <rect x="60" y="556" width="300" height="62" rx="12" fill="#0e1640" stroke="#ff9f6b" stroke-width="2"/>
      <text x="76" y="580" font-size="14" font-weight="700" fill="#ffb890">payload 는 메모리에만</text>
      <text x="76" y="602" font-size="13" fill="#e3c9bb">localStorage 에 넣으면 만든 이유가 사라진다</text>
    </g>

    <!-- why two steps -->
    <g>
      <rect x="760" y="216" width="380" height="126" rx="14" fill="#101a4c" stroke="#8ad8ff" stroke-width="2" opacity="0.95"/>
      <text x="782" y="246" font-size="16" font-weight="700" fill="#ffffff">왜 두 단계인가</text>
      <text x="782" y="273" font-size="13.5" fill="#c9d6ff">URL은 히스토리 · 북마크 · Referer ·</text>
      <text x="782" y="293" font-size="13.5" fill="#c9d6ff">웹서버 액세스 로그에 남는다.</text>
      <text x="782" y="313" font-size="13.5" fill="#c9d6ff">액세스 로그는 앱 코드로 지울 수 없다.</text>
      <text x="782" y="333" font-size="13.5" fill="#8ad8ff">그래서 시크릿은 POST 본문으로만 온다</text>
    </g>

    <g>
      <rect x="760" y="366" width="380" height="106" rx="14" fill="#101a4c" stroke="#aebcff" stroke-width="2" opacity="0.95"/>
      <text x="782" y="396" font-size="16" font-weight="700" fill="#ffffff">PKCE (S256)</text>
      <text x="782" y="423" font-size="13.5" fill="#c9d6ff">code 를 훔쳐도 code_verifier 가 없으면</text>
      <text x="782" y="443" font-size="13.5" fill="#c9d6ff">교환되지 않는다 — 60초 창까지 닫는다.</text>
      <text x="782" y="463" font-size="13" fill="#9aa8e8">verifier 는 앱 메모리를 떠나지 않는다</text>
    </g>
  </g>
</svg>
