<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="ulogin 시스템 구조 — 화면 8개, API 엔드포인트 32파일, core 내부 모듈 13개, MySQL 15테이블">
  <defs>
    <linearGradient id="ua-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1030"/>
      <stop offset="0.55" stop-color="#131a4a"/>
      <stop offset="1" stop-color="#1b2570"/>
    </linearGradient>
    <linearGradient id="ua-wire" gradientUnits="userSpaceOnUse" x1="320" y1="0" x2="920" y2="0">
      <stop offset="0" stop-color="#4f7bff"/>
      <stop offset="1" stop-color="#8ad8ff"/>
    </linearGradient>
    <marker id="ua-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8ad8ff"/>
    </marker>
  </defs>

  <rect width="1200" height="675" fill="url(#ua-bg)"/>

  <g stroke="#3a4790" stroke-width="1" opacity="0.18">
    <path d="M0 112 H1200 M0 225 H1200 M0 337 H1200 M0 450 H1200 M0 562 H1200"/>
    <path d="M150 0 V675 M300 0 V675 M450 0 V675 M600 0 V675 M750 0 V675 M900 0 V675 M1050 0 V675"/>
  </g>

  <g font-family="'Segoe UI','Noto Sans KR',sans-serif">
    <text x="60" y="58" font-size="30" font-weight="700" fill="#ffffff">시스템 구조 — 모든 요청이 bootstrap 한 곳을 지난다</text>
    <text x="60" y="86" font-size="16" fill="#aeb9f0">공용 호스팅 전제 · Composer 없음 · 빌드 단계 0 · 외부 의존 0개</text>

    <!-- client column -->
    <g>
      <rect x="56" y="120" width="268" height="180" rx="16" fill="#0f1848" stroke="#8ad8ff" stroke-width="2"/>
      <text x="80" y="152" font-size="18" font-weight="700" fill="#ffffff">클라이언트</text>
      <text x="80" y="182" font-size="14" fill="#c9d6ff">ulogin-client.js — 4줄 연동</text>
      <text x="80" y="206" font-size="14" fill="#c9d6ff">app.html · callback.html</text>
      <text x="80" y="236" font-size="13.5" fill="#8ad8ff">정적 HTML. 프록시도 SSR도 없다</text>
      <text x="80" y="262" font-size="13.5" fill="#8ad8ff">받은 시크릿은 메모리에만 둔다</text>
      <text x="80" y="288" font-size="13" fill="#7f8ccc">호출마다 포인트를 차감한다</text>
    </g>

    <!-- screens -->
    <g>
      <rect x="56" y="322" width="268" height="152" rx="16" fill="#0f1848" stroke="#aebcff" stroke-width="2"/>
      <text x="80" y="354" font-size="18" font-weight="700" fill="#ffffff">public/ — 화면 8개</text>
      <text x="80" y="382" font-size="14" fill="#c9d6ff">login · register · forgot · reset</text>
      <text x="80" y="404" font-size="14" fill="#c9d6ff">verify · mypage · admin · index</text>
      <text x="80" y="432" font-size="13.5" fill="#aebcff">Vanilla JS. 프레임워크·번들러 없음</text>
      <text x="80" y="456" font-size="13" fill="#7f8ccc">마이페이지 7탭 · 관리자 콘솔 6탭</text>
    </g>

    <!-- installer -->
    <g>
      <rect x="56" y="496" width="268" height="120" rx="16" fill="#0f1848" stroke="#ff9f6b" stroke-width="2"/>
      <text x="80" y="528" font-size="18" font-weight="700" fill="#ffffff">웹 설치기 — 8단계</text>
      <text x="80" y="556" font-size="13.5" fill="#e3c9bb">환경 점검 · DB · 스키마 · 키 생성</text>
      <text x="80" y="578" font-size="13.5" fill="#e3c9bb">관리자 · 첫 서비스 · 시크릿 · 자기 잠금</text>
      <text x="80" y="602" font-size="13" fill="#ffb890">생성한 키는 화면에 표시하지 않는다</text>
    </g>

    <!-- arrows to server -->
    <g stroke="url(#ua-wire)" stroke-width="3" fill="none">
      <path d="M330 210 H430" marker-end="url(#ua-ar)"/>
      <path d="M330 398 H430" marker-end="url(#ua-ar)"/>
    </g>

    <!-- bootstrap -->
    <g>
      <rect x="440" y="120" width="380" height="86" rx="16" fill="#242f80" stroke="#ffffff" stroke-width="2"/>
      <text x="630" y="152" text-anchor="middle" font-size="19" font-weight="700" fill="#ffffff">core/bootstrap.php — 단일 관문</text>
      <text x="630" y="177" text-anchor="middle" font-size="13.5" fill="#dfe6ff">설정 로드 · CORS · HTTPS 강제 · 부트 상수</text>
      <text x="630" y="197" text-anchor="middle" font-size="13" fill="#aebcff">나머지 12개 모듈은 상수가 없으면 404로 즉시 종료</text>
    </g>

    <!-- api -->
    <g>
      <rect x="440" y="226" width="380" height="146" rx="16" fill="#1a2360" stroke="#8ad8ff" stroke-width="2"/>
      <text x="464" y="258" font-size="18" font-weight="700" fill="#ffffff">server/api/ — 엔드포인트 32파일</text>
      <text x="464" y="286" font-size="14" fill="#c9d6ff">auth · sso · me · points · admin</text>
      <text x="464" y="310" font-size="13.5" fill="#8ad8ff">메서드 × 경로 43 · 에러 코드 31종</text>
      <text x="464" y="334" font-size="13.5" fill="#8ad8ff">파일 경로 = URL 경로 (mod_rewrite 불필요)</text>
      <text x="464" y="358" font-size="13" fill="#7f8ccc">응답 봉투 하나 — { ok, data, error }</text>
    </g>

    <!-- core -->
    <g>
      <rect x="440" y="392" width="380" height="126" rx="16" fill="#1a2360" stroke="#aebcff" stroke-width="2"/>
      <text x="464" y="424" font-size="18" font-weight="700" fill="#ffffff">server/core/ — 내부 모듈 13개</text>
      <text x="464" y="452" font-size="14" fill="#c9d6ff">db · request · response · auth · perm</text>
      <text x="464" y="476" font-size="14" fill="#c9d6ff">payload · crypto · ratelimit · logger</text>
      <text x="464" y="500" font-size="14" fill="#c9d6ff">serializer · mailer · gc</text>
    </g>

    <!-- fail closed -->
    <g>
      <rect x="440" y="538" width="380" height="78" rx="16" fill="#3a1c2a" stroke="#ff8fa3" stroke-width="2"/>
      <text x="464" y="568" font-size="17" font-weight="700" fill="#ffd7de">fail-closed — 조용한 오작동을 없앤다</text>
      <text x="464" y="592" font-size="13.5" fill="#f0c2cc">모순된 설정은 500 + 로그 1줄. 본문에 원인은 없다</text>
      <text x="464" y="610" font-size="13" fill="#d8a3b0">HTTPS 강제·프록시·쿠키 secure·쿠키 경로 4종</text>
    </g>

    <g stroke="url(#ua-wire)" stroke-width="3" fill="none">
      <path d="M826 300 H906" marker-end="url(#ua-ar)"/>
    </g>

    <!-- db -->
    <g>
      <rect x="916" y="226" width="228" height="200" rx="16" fill="#123c46" stroke="#7ff0c0" stroke-width="2"/>
      <text x="938" y="258" font-size="18" font-weight="700" fill="#ffffff">MySQL / MariaDB</text>
      <text x="938" y="286" font-size="14" fill="#c6f5e2">테이블 15개</text>
      <text x="938" y="310" font-size="13.5" fill="#7ff0c0">prefix app_ulogin_</text>
      <text x="938" y="334" font-size="13" fill="#a8ddca">DB 1개를 다른 앱과 공유해도 된다</text>
      <text x="938" y="366" font-size="13.5" fill="#c6f5e2">시크릿은 AES-256-CBC로</text>
      <text x="938" y="386" font-size="13.5" fill="#c6f5e2">암호화 저장</text>
      <text x="938" y="410" font-size="13" fill="#a8ddca">토큰은 전부 SHA-256 해시로만</text>
    </g>

    <!-- three axis -->
    <g>
      <rect x="916" y="446" width="228" height="170" rx="16" fill="#0f1848" stroke="#c9a8ff" stroke-width="2"/>
      <text x="938" y="478" font-size="18" font-weight="700" fill="#ffffff">3축 등급</text>
      <text x="938" y="506" font-size="13.5" fill="#e0d0ff">계정등급 guest→staff</text>
      <text x="938" y="528" font-size="13.5" fill="#e0d0ff">역할 user→superadmin</text>
      <text x="938" y="550" font-size="13.5" fill="#e0d0ff">결제등급 free→enterprise</text>
      <text x="938" y="578" font-size="13" fill="#c9a8ff">랭크 정수로 비교한다 —</text>
      <text x="938" y="598" font-size="13" fill="#c9a8ff">문자열 비교는 조용히 틀린다</text>
    </g>

    <!-- server label -->
    <text x="440" y="112" font-size="13" fill="#7f8ccc">ulogin 서버 · 설치 루트</text>
  </g>
</svg>
