<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Red-Eye-Engine — HTTP 통신 처리 올인원 C# 라이브러리 표지">
  <defs>
    <linearGradient id="rbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#120c1c"/>
      <stop offset="0.55" stop-color="#241026"/>
      <stop offset="1" stop-color="#4a1230"/>
    </linearGradient>
    <linearGradient id="rwire" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff6b6b"/>
      <stop offset="1" stop-color="#ffc27a"/>
    </linearGradient>
    <radialGradient id="rcore" cx="0.5" cy="0.42" r="0.62">
      <stop offset="0" stop-color="#ffb4a8"/>
      <stop offset="0.5" stop-color="#e8434f"/>
      <stop offset="1" stop-color="#8d1230"/>
    </radialGradient>
    <filter id="rsoft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#rbg)"/>

  <!-- faint grid -->
  <g stroke="#7a3a55" stroke-width="1" opacity="0.2">
    <path d="M0 112 H1200 M0 225 H1200 M0 337 H1200 M0 450 H1200 M0 562 H1200"/>
    <path d="M150 0 V675 M300 0 V675 M450 0 V675 M600 0 V675 M750 0 V675 M900 0 V675 M1050 0 V675"/>
  </g>

  <!-- left: calling apps -->
  <g font-family="'Segoe UI','Malgun Gothic',sans-serif" font-size="16" fill="#f6dfe4">
    <g>
      <rect x="66" y="120" width="176" height="56" rx="12" fill="#3a1a2c" stroke="#c0566f" stroke-width="1.5"/>
      <text x="154" y="154" text-anchor="middle">WinForms 앱</text>
    </g>
    <g>
      <rect x="66" y="222" width="176" height="56" rx="12" fill="#3a1a2c" stroke="#c0566f" stroke-width="1.5"/>
      <text x="154" y="256" text-anchor="middle">콘솔 도구</text>
    </g>
    <g>
      <rect x="66" y="324" width="176" height="56" rx="12" fill="#3a1a2c" stroke="#c0566f" stroke-width="1.5"/>
      <text x="154" y="358" text-anchor="middle">배치 스크립트</text>
    </g>
    <text x="154" y="412" text-anchor="middle" font-size="14" fill="#d79aad">참조 1줄로 공유</text>
  </g>

  <!-- wires: apps -> library -->
  <g stroke="url(#rwire)" stroke-width="3" fill="none" opacity="0.9">
    <path d="M242 148 C 330 158, 380 210, 452 248"/>
    <path d="M242 250 C 340 250, 390 250, 452 250"/>
    <path d="M242 352 C 330 342, 380 290, 452 252"/>
  </g>

  <!-- center: the DLL -->
  <rect x="452" y="140" width="296" height="220" rx="20" fill="url(#rcore)" filter="url(#rsoft)" opacity="0.5"/>
  <rect x="462" y="150" width="276" height="200" rx="18" fill="url(#rcore)" stroke="#ffdfd7" stroke-width="2"/>
  <text x="600" y="206" text-anchor="middle" font-family="'Segoe UI',sans-serif" font-size="30" font-weight="700" fill="#ffffff">RedEyeEngine</text>
  <text x="600" y="238" text-anchor="middle" font-family="'Segoe UI',sans-serif" font-size="20" font-weight="700" letter-spacing="4" fill="#ffe0d8">.dll</text>
  <g font-family="'Segoe UI','Malgun Gothic',sans-serif" font-size="15" fill="#3a0d1c" text-anchor="middle">
    <rect x="476" y="258" width="248" height="30" rx="8" fill="#ffd9c9" opacity="0.92"/>
    <text x="600" y="278" font-size="14">HttpSend · Bytes · Cookie · Socket</text>
    <rect x="476" y="298" width="248" height="30" rx="8" fill="#ffd9c9" opacity="0.78"/>
    <text x="600" y="318">프록시 · 헤더 · gzip · 타임아웃</text>
  </g>

  <!-- wires: library -> network -->
  <g stroke="url(#rwire)" stroke-width="3" fill="none" opacity="0.9">
    <path d="M748 218 C 830 200, 880 176, 952 162"/>
    <path d="M748 250 C 840 250, 890 250, 952 250"/>
    <path d="M748 282 C 830 300, 880 324, 952 338"/>
  </g>

  <!-- right: modules / targets -->
  <g font-family="'Segoe UI','Malgun Gothic',sans-serif" font-size="16" fill="#f6dfe4">
    <g>
      <rect x="952" y="134" width="182" height="56" rx="12" fill="#3a1a2c" stroke="#e0a06f" stroke-width="1.5"/>
      <text x="1043" y="168" text-anchor="middle">HTTP 서버</text>
    </g>
    <g>
      <rect x="952" y="222" width="182" height="56" rx="12" fill="#3a1a2c" stroke="#e0a06f" stroke-width="1.5"/>
      <text x="1043" y="256" text-anchor="middle">NIC · 프록시 제어</text>
    </g>
    <g>
      <rect x="952" y="310" width="182" height="56" rx="12" fill="#3a1a2c" stroke="#e0a06f" stroke-width="1.5"/>
      <text x="1043" y="344" text-anchor="middle">이미지 · ADB</text>
    </g>
    <text x="1043" y="400" text-anchor="middle" font-size="14" fill="#d79aad">같은 어셈블리 내 모듈</text>
  </g>

  <!-- strip -->
  <text x="600" y="470" text-anchor="middle" font-family="'Segoe UI','Malgun Gothic',sans-serif" font-size="16" fill="#e2a5b6">.NET Framework 3.5 클래스 라이브러리 · 요청 준비 코드를 호출 하나로</text>

  <!-- title band -->
  <text x="600" y="562" text-anchor="middle" font-family="'Georgia',serif" font-size="42" font-weight="600" fill="#ffffff">HTTP 통신 처리 올인원 라이브러리</text>
  <text x="600" y="612" text-anchor="middle" font-family="'Segoe UI',sans-serif" font-size="17" letter-spacing="3" fill="#e08a9d">RED-EYE-ENGINE</text>
</svg>
