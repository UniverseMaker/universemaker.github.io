<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="도시안전 AI API — 멀티모달 재난 상황 인지 모델 서빙 게이트웨이 개념도">
  <defs>
    <linearGradient id="csbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1030"/>
      <stop offset="0.55" stop-color="#131a4a"/>
      <stop offset="1" stop-color="#1b2570"/>
    </linearGradient>
    <linearGradient id="cswire" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4f7bff"/>
      <stop offset="1" stop-color="#8ad8ff"/>
    </linearGradient>
    <linearGradient id="cscore" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b74ff"/>
      <stop offset="1" stop-color="#2233c4"/>
    </linearGradient>
    <filter id="cssoft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#csbg)"/>

  <!-- faint grid -->
  <g stroke="#3a4790" stroke-width="1" opacity="0.2">
    <path d="M0 112 H1200 M0 225 H1200 M0 337 H1200 M0 450 H1200 M0 562 H1200"/>
    <path d="M150 0 V675 M300 0 V675 M450 0 V675 M600 0 V675 M750 0 V675 M900 0 V675 M1050 0 V675"/>
  </g>

  <!-- title -->
  <g font-family="'Segoe UI',sans-serif" text-anchor="middle">
    <text x="600" y="92" font-size="52" font-weight="700" fill="#ffffff">도시안전 AI API</text>
    <text x="600" y="128" font-size="20" letter-spacing="3" fill="#9fb0ff">URBAN SAFETY AI · SERVING GATEWAY</text>
  </g>

  <!-- wires : modalities -> core -->
  <g stroke="url(#cswire)" stroke-width="3" fill="none" opacity="0.85">
    <path d="M300 262 C 400 262, 420 330, 476 358"/>
    <path d="M300 330 C 400 330, 420 352, 476 368"/>
    <path d="M300 398 C 400 398, 420 386, 476 380"/>
    <path d="M300 466 C 400 466, 420 412, 476 392"/>
  </g>
  <!-- wire : core -> gateway -->
  <path d="M724 375 H 862" stroke="url(#cswire)" stroke-width="5" fill="none" opacity="0.95"/>
  <path d="M862 375 l -16 -9 v 18 z" fill="#8ad8ff"/>

  <!-- modality chips -->
  <g font-family="'Segoe UI',sans-serif" font-size="21" fill="#0b1030" text-anchor="middle">
    <g>
      <rect x="104" y="236" width="196" height="52" rx="26" fill="#8ad8ff"/>
      <text x="202" y="269">영상 · CCTV/드론</text>
    </g>
    <g>
      <rect x="104" y="304" width="196" height="52" rx="26" fill="#8ad8ff"/>
      <text x="202" y="337">센서 시계열</text>
    </g>
    <g>
      <rect x="104" y="372" width="196" height="52" rx="26" fill="#7ff0c0"/>
      <text x="202" y="405">공간정보 KG</text>
    </g>
    <g>
      <rect x="104" y="440" width="196" height="52" rx="26" fill="#7ff0c0"/>
      <text x="202" y="473">상황보고 텍스트</text>
    </g>
  </g>
  <text x="202" y="204" text-anchor="middle" font-family="'Segoe UI',sans-serif" font-size="17" letter-spacing="2" fill="#9fb0ff">4개 모달리티 입력</text>

  <!-- core -->
  <rect x="470" y="292" width="260" height="166" rx="26" fill="url(#cscore)" filter="url(#cssoft)" opacity="0.6"/>
  <rect x="476" y="298" width="248" height="154" rx="22" fill="url(#cscore)" stroke="#dfe6ff" stroke-width="2"/>
  <g font-family="'Segoe UI',sans-serif" text-anchor="middle" fill="#ffffff">
    <text x="600" y="345" font-size="24" font-weight="700">멀티모달</text>
    <text x="600" y="378" font-size="24" font-weight="700">파운데이션 모델</text>
    <text x="600" y="414" font-size="16" fill="#cdd6ff">프로젝션 정렬 · LoRA 적응</text>
  </g>

  <!-- gateway panel -->
  <rect x="868" y="236" width="230" height="278" rx="22" fill="#111a52" stroke="#5b74ff" stroke-width="2"/>
  <text x="983" y="276" text-anchor="middle" font-family="'Segoe UI',sans-serif" font-size="20" font-weight="700" fill="#ffffff">REST 게이트웨이</text>
  <g font-family="'Segoe UI',sans-serif" font-size="18" fill="#0b1030" text-anchor="middle">
    <g><rect x="894" y="296" width="178" height="40" rx="20" fill="#8ad8ff"/><text x="983" y="322">/infer</text></g>
    <g><rect x="894" y="344" width="178" height="40" rx="20" fill="#8ad8ff"/><text x="983" y="370">/e2e · /stream</text></g>
    <g><rect x="894" y="392" width="178" height="40" rx="20" fill="#7ff0c0"/><text x="983" y="418">/schemas</text></g>
    <g><rect x="894" y="440" width="178" height="40" rx="20" fill="#7ff0c0"/><text x="983" y="466">/latency · /health</text></g>
  </g>

  <!-- footer strip -->
  <rect x="0" y="580" width="1200" height="95" fill="#0a0f2c" opacity="0.75"/>
  <g font-family="'Segoe UI',sans-serif" text-anchor="middle">
    <text x="600" y="620" font-size="21" fill="#cdd6ff">화재 · 침수 · 붕괴 재난 상황 인지 · JSON Schema 단일 진실원본 검증</text>
    <text x="600" y="652" font-size="17" fill="#7f8ed6">KAIST · 지역혁신클러스터육성(R&amp;D) 도시안전 AI</text>
  </g>
</svg>
