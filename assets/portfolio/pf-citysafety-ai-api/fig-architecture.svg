<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-label="도시안전 AI API 소프트웨어 계층 구조 — 인코더·프로젝션·백본·서빙·검증 계층">
  <defs>
    <linearGradient id="abg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1030"/>
      <stop offset="0.55" stop-color="#131a4a"/>
      <stop offset="1" stop-color="#1b2570"/>
    </linearGradient>
    <linearGradient id="awire" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4f7bff"/>
      <stop offset="1" stop-color="#8ad8ff"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="760" fill="url(#abg)"/>
  <g stroke="#3a4790" stroke-width="1" opacity="0.18">
    <path d="M0 130 H1200 M0 260 H1200 M0 390 H1200 M0 520 H1200 M0 650 H1200"/>
    <path d="M200 0 V760 M400 0 V760 M600 0 V760 M800 0 V760 M1000 0 V760"/>
  </g>

  <text x="600" y="62" text-anchor="middle" font-family="'Segoe UI',sans-serif" font-size="34" font-weight="700" fill="#ffffff">시스템 아키텍처 — 인코더에서 API까지</text>
  <text x="600" y="94" text-anchor="middle" font-family="'Segoe UI',sans-serif" font-size="17" letter-spacing="2" fill="#9fb0ff">ENCODERS → PROJECTION → LLM BACKBONE → SERVING → API</text>

  <!-- Layer 1 : encoders -->
  <rect x="60" y="122" width="1080" height="118" rx="18" fill="#111a52" stroke="#3f56b8" stroke-width="1.5"/>
  <text x="86" y="152" font-family="'Segoe UI',sans-serif" font-size="15" letter-spacing="2" fill="#7f8ed6">01  모달리티 인코더</text>
  <g font-family="'Segoe UI',sans-serif" font-size="19" fill="#0b1030" text-anchor="middle">
    <g><rect x="88" y="166" width="238" height="54" rx="14" fill="#8ad8ff"/><text x="207" y="199">Vision Encoder</text></g>
    <g><rect x="342" y="166" width="238" height="54" rx="14" fill="#8ad8ff"/><text x="461" y="199">Sensor Encoder</text></g>
    <g><rect x="596" y="166" width="238" height="54" rx="14" fill="#7ff0c0"/><text x="715" y="199">Geo Encoder (KG)</text></g>
    <g><rect x="850" y="166" width="238" height="54" rx="14" fill="#7ff0c0"/><text x="969" y="199">Text Passthrough</text></g>
  </g>

  <path d="M600 240 V 282" stroke="url(#awire)" stroke-width="4" fill="none"/>
  <path d="M600 288 l -9 -16 h 18 z" fill="#8ad8ff"/>

  <!-- Layer 2 : projection -->
  <rect x="60" y="292" width="1080" height="90" rx="18" fill="#111a52" stroke="#3f56b8" stroke-width="1.5"/>
  <text x="86" y="322" font-family="'Segoe UI',sans-serif" font-size="15" letter-spacing="2" fill="#7f8ed6">02  프로젝션 레이어 (임베딩 공간 정렬)</text>
  <g font-family="'Segoe UI',sans-serif" font-size="18" fill="#0b1030" text-anchor="middle">
    <g><rect x="240" y="332" width="200" height="40" rx="20" fill="#8ad8ff"/><text x="340" y="359">Linear</text></g>
    <g><rect x="500" y="332" width="200" height="40" rx="20" fill="#8ad8ff"/><text x="600" y="359">MLP</text></g>
    <g><rect x="760" y="332" width="200" height="40" rx="20" fill="#8ad8ff"/><text x="860" y="359">Cross-Attention</text></g>
  </g>

  <path d="M600 382 V 424" stroke="url(#awire)" stroke-width="4" fill="none"/>
  <path d="M600 430 l -9 -16 h 18 z" fill="#8ad8ff"/>

  <!-- Layer 3 : backbone -->
  <rect x="60" y="434" width="1080" height="96" rx="18" fill="#1b2570" stroke="#7f95ff" stroke-width="2"/>
  <text x="86" y="464" font-family="'Segoe UI',sans-serif" font-size="15" letter-spacing="2" fill="#9fb0ff">03  LLM 백본 — 동결 + LoRA 어댑터</text>
  <g font-family="'Segoe UI',sans-serif" font-size="18" fill="#ffffff">
    <text x="120" y="502">Stage 0 인코더 독립</text>
    <text x="380" y="502">Stage 1 정렬</text>
    <text x="600" y="502">Stage 2 LoRA 공동학습</text>
    <text x="900" y="502">Stage 3 재난 인지 SFT</text>
  </g>

  <path d="M600 530 V 572" stroke="url(#awire)" stroke-width="4" fill="none"/>
  <path d="M600 578 l -9 -16 h 18 z" fill="#8ad8ff"/>

  <!-- Layer 4 : serving -->
  <rect x="60" y="582" width="1080" height="100" rx="18" fill="#111a52" stroke="#3f56b8" stroke-width="1.5"/>
  <text x="86" y="612" font-family="'Segoe UI',sans-serif" font-size="15" letter-spacing="2" fill="#7f8ed6">04  서빙 계층 — 교체 가능한 백엔드 + FastAPI 게이트웨이</text>
  <g font-family="'Segoe UI',sans-serif" font-size="17" fill="#0b1030" text-anchor="middle">
    <g><rect x="88" y="626" width="182" height="42" rx="21" fill="#8ad8ff"/><text x="179" y="654">mock</text></g>
    <g><rect x="286" y="626" width="182" height="42" rx="21" fill="#8ad8ff"/><text x="377" y="654">local (규칙기반)</text></g>
    <g><rect x="484" y="626" width="182" height="42" rx="21" fill="#8ad8ff"/><text x="575" y="654">hf transformers</text></g>
    <g><rect x="682" y="626" width="182" height="42" rx="21" fill="#7ff0c0"/><text x="773" y="654">commercial API</text></g>
    <g><rect x="880" y="626" width="208" height="42" rx="21" fill="#7ff0c0"/><text x="984" y="654">vLLM (본탑재)</text></g>
  </g>

  <!-- Layer 5 : SSOT band -->
  <rect x="60" y="700" width="1080" height="44" rx="14" fill="#0a0f2c" stroke="#5b74ff" stroke-width="1.5"/>
  <text x="600" y="728" text-anchor="middle" font-family="'Segoe UI',sans-serif" font-size="18" fill="#cdd6ff">모든 기관 간 경계는 JSON Schema 단일 진실원본으로 검증 — 위반 요청은 422로 거절</text>
</svg>
