<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" role="img" aria-label="재난 상황 인지 종단간 파이프라인 8단계 — 센서 입력에서 통합 상황판까지">
  <defs>
    <linearGradient id="pbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1030"/>
      <stop offset="0.55" stop-color="#131a4a"/>
      <stop offset="1" stop-color="#1b2570"/>
    </linearGradient>
    <linearGradient id="pwire" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4f7bff"/>
      <stop offset="1" stop-color="#8ad8ff"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="720" fill="url(#pbg)"/>
  <g stroke="#3a4790" stroke-width="1" opacity="0.18">
    <path d="M0 120 H1200 M0 240 H1200 M0 360 H1200 M0 480 H1200 M0 600 H1200"/>
    <path d="M200 0 V720 M400 0 V720 M600 0 V720 M800 0 V720 M1000 0 V720"/>
  </g>

  <text x="600" y="62" text-anchor="middle" font-family="'Segoe UI',sans-serif" font-size="34" font-weight="700" fill="#ffffff">재난 상황 인지 종단간 파이프라인</text>
  <text x="600" y="94" text-anchor="middle" font-family="'Segoe UI',sans-serif" font-size="17" letter-spacing="2" fill="#9fb0ff">EDGE SENSOR → RAG · SAFETY KG → MODEL → PLATFORM</text>

  <!-- row 1 -->
  <g stroke="url(#pwire)" stroke-width="4" fill="none" opacity="0.9">
    <path d="M318 210 H 372"/><path d="M606 210 H 660"/><path d="M894 210 H 948"/>
  </g>
  <g fill="#8ad8ff">
    <path d="M378 210 l -16 -9 v 18 z"/><path d="M666 210 l -16 -9 v 18 z"/><path d="M954 210 l -16 -9 v 18 z"/>
  </g>

  <g font-family="'Segoe UI',sans-serif">
    <g>
      <rect x="60" y="152" width="258" height="116" rx="18" fill="#111a52" stroke="#5b74ff" stroke-width="2"/>
      <text x="82" y="182" font-size="14" letter-spacing="2" fill="#7f8ed6">STEP 1</text>
      <text x="82" y="214" font-size="21" font-weight="600" fill="#ffffff">엣지 센서 입력</text>
      <text x="82" y="244" font-size="15" fill="#9fb0ff">영상 스트림 · 수위/온도/진동</text>
    </g>
    <g>
      <rect x="378" y="152" width="228" height="116" rx="18" fill="#111a52" stroke="#3f56b8" stroke-width="1.5"/>
      <text x="400" y="182" font-size="14" letter-spacing="2" fill="#7f8ed6">STEP 2</text>
      <text x="400" y="214" font-size="21" font-weight="600" fill="#ffffff">RAG 컨텍스트</text>
      <text x="400" y="244" font-size="15" fill="#9fb0ff">법령 · 대응 SOP 근거</text>
    </g>
    <g>
      <rect x="666" y="152" width="228" height="116" rx="18" fill="#111a52" stroke="#3f56b8" stroke-width="1.5"/>
      <text x="688" y="182" font-size="14" letter-spacing="2" fill="#7f8ed6">STEP 3</text>
      <text x="688" y="214" font-size="21" font-weight="600" fill="#ffffff">공간 KG ↔ 3D</text>
      <text x="688" y="244" font-size="15" fill="#9fb0ff">지역·건물 노드 매핑</text>
    </g>
    <g>
      <rect x="954" y="152" width="186" height="116" rx="18" fill="#111a52" stroke="#3f56b8" stroke-width="1.5"/>
      <text x="976" y="182" font-size="14" letter-spacing="2" fill="#7f8ed6">STEP 4</text>
      <text x="976" y="214" font-size="21" font-weight="600" fill="#ffffff">추론 요청</text>
      <text x="976" y="244" font-size="15" fill="#9fb0ff">스키마 검증</text>
    </g>
  </g>

  <!-- connector down -->
  <path d="M1047 268 V 318 H 153 V 368" stroke="url(#pwire)" stroke-width="4" fill="none" opacity="0.75"/>
  <path d="M153 374 l -9 -16 h 18 z" fill="#8ad8ff"/>

  <!-- row 2 -->
  <g stroke="url(#pwire)" stroke-width="4" fill="none" opacity="0.9">
    <path d="M318 430 H 372"/><path d="M606 430 H 660"/><path d="M894 430 H 948"/>
  </g>
  <g fill="#8ad8ff">
    <path d="M378 430 l -16 -9 v 18 z"/><path d="M666 430 l -16 -9 v 18 z"/><path d="M954 430 l -16 -9 v 18 z"/>
  </g>

  <g font-family="'Segoe UI',sans-serif">
    <g>
      <rect x="60" y="372" width="258" height="116" rx="18" fill="#1b2570" stroke="#7f95ff" stroke-width="2"/>
      <text x="82" y="402" font-size="14" letter-spacing="2" fill="#9fb0ff">STEP 5</text>
      <text x="82" y="434" font-size="21" font-weight="600" fill="#ffffff">모델 추론 응답</text>
      <text x="82" y="464" font-size="15" fill="#9fb0ff">재난 유형 · 심각도 · 근거</text>
    </g>
    <g>
      <rect x="378" y="372" width="228" height="116" rx="18" fill="#111a52" stroke="#3f56b8" stroke-width="1.5"/>
      <text x="400" y="402" font-size="14" letter-spacing="2" fill="#7f8ed6">STEP 6</text>
      <text x="400" y="434" font-size="21" font-weight="600" fill="#ffffff">엔드포인트 등록</text>
      <text x="400" y="464" font-size="15" fill="#9fb0ff">실증 플랫폼 연계</text>
    </g>
    <g>
      <rect x="666" y="372" width="228" height="116" rx="18" fill="#111a52" stroke="#3f56b8" stroke-width="1.5"/>
      <text x="688" y="402" font-size="14" letter-spacing="2" fill="#7f8ed6">STEP 7</text>
      <text x="688" y="434" font-size="21" font-weight="600" fill="#ffffff">평가 바인딩</text>
      <text x="688" y="464" font-size="15" fill="#9fb0ff">시나리오별 시험 연결</text>
    </g>
    <g>
      <rect x="954" y="372" width="186" height="116" rx="18" fill="#1b2570" stroke="#7f95ff" stroke-width="2"/>
      <text x="976" y="402" font-size="14" letter-spacing="2" fill="#9fb0ff">STEP 8</text>
      <text x="976" y="434" font-size="21" font-weight="600" fill="#ffffff">통합 상황판</text>
      <text x="976" y="464" font-size="15" fill="#9fb0ff">대응 전략 제시</text>
    </g>
  </g>

  <!-- scenario band -->
  <rect x="60" y="530" width="1080" height="76" rx="18" fill="#0a0f2c" stroke="#5b74ff" stroke-width="1.5"/>
  <text x="86" y="562" font-family="'Segoe UI',sans-serif" font-size="15" letter-spacing="2" fill="#7f8ed6">시나리오</text>
  <g font-family="'Segoe UI',sans-serif" font-size="18" fill="#0b1030" text-anchor="middle">
    <g><rect x="260" y="546" width="250" height="44" rx="22" fill="#8ad8ff"/><text x="385" y="575">하천 범람 · 침수</text></g>
    <g><rect x="540" y="546" width="250" height="44" rx="22" fill="#8ad8ff"/><text x="665" y="575">지하 공간 화재</text></g>
    <g><rect x="820" y="546" width="270" height="44" rx="22" fill="#7ff0c0"/><text x="955" y="575">노후 건물 붕괴 위험</text></g>
  </g>

  <text x="600" y="662" text-anchor="middle" font-family="'Segoe UI',sans-serif" font-size="17" fill="#cdd6ff">전 구간이 서버-전송 이벤트로 스트리밍되어 단계별 진행 상황을 실시간으로 관측한다</text>
</svg>
