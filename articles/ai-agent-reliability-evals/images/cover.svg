<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="데모에서 프로덕션으로 넘어갈 때 무너지는 에이전트 신뢰성과 가드레일 개념도">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1026"/>
      <stop offset="1" stop-color="#1b2150"/>
    </linearGradient>
    <linearGradient id="drop" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5b74ff"/>
      <stop offset="0.5" stop-color="#8b5bff"/>
      <stop offset="1" stop-color="#c47f13"/>
    </linearGradient>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#c47f13"/></marker>
  </defs>
  <rect x="0" y="0" width="1200" height="630" fill="url(#bg)"/>

  <!-- grid -->
  <g stroke="#2b356e" stroke-width="1" opacity="0.5">
    <line x1="90" y1="120" x2="90" y2="470"/>
    <line x1="90" y1="470" x2="1110" y2="470"/>
    <line x1="90" y1="295" x2="1110" y2="295" stroke-dasharray="5 7"/>
  </g>

  <!-- axis labels -->
  <text x="70" y="130" text-anchor="end" font-family="'Segoe UI',sans-serif" font-size="16" fill="#9aa4e0">100%</text>
  <text x="70" y="300" text-anchor="end" font-family="'Segoe UI',sans-serif" font-size="16" fill="#9aa4e0">50%</text>
  <text x="70" y="475" text-anchor="end" font-family="'Segoe UI',sans-serif" font-size="16" fill="#9aa4e0">0%</text>

  <!-- reliability curve: high in demo, collapsing across steps -->
  <path d="M110 150 C 260 158, 360 175, 470 215 S 700 360, 860 415 S 1030 452, 1090 458" fill="none" stroke="url(#drop)" stroke-width="6" stroke-linecap="round"/>
  <circle cx="110" cy="150" r="9" fill="#5b74ff"/>
  <circle cx="1090" cy="458" r="9" fill="#c47f13"/>

  <!-- demo / production markers -->
  <text x="120" y="205" font-family="'Segoe UI',sans-serif" font-size="20" font-weight="700" fill="#a8b6ff">데모 (단발 성공)</text>
  <text x="1080" y="430" text-anchor="end" font-family="'Segoe UI',sans-serif" font-size="20" font-weight="700" fill="#e6b26a">프로덕션 (반복·연쇄)</text>

  <text x="600" y="510" text-anchor="middle" font-family="'Segoe UI',sans-serif" font-size="17" fill="#8b95d4">단계 수 · 반복 시도(k) →  단계마다 곱해지는 오류가 성공률을 무너뜨린다</text>

  <!-- guardrail layers (bottom band) -->
  <g font-family="'Segoe UI',sans-serif">
    <rect x="90" y="548" width="240" height="52" rx="10" fill="#1f2a63" stroke="#5b74ff" stroke-width="1.5"/>
    <text x="210" y="580" text-anchor="middle" font-size="17" font-weight="600" fill="#cdd6ff">평가 · Evals</text>
    <rect x="350" y="548" width="240" height="52" rx="10" fill="#1f2a63" stroke="#8b5bff" stroke-width="1.5"/>
    <text x="470" y="580" text-anchor="middle" font-size="17" font-weight="600" fill="#d9ccff">가드레일 · HITL</text>
    <rect x="610" y="548" width="240" height="52" rx="10" fill="#1f2a63" stroke="#0f8a55" stroke-width="1.5"/>
    <text x="730" y="580" text-anchor="middle" font-size="17" font-weight="600" fill="#b7ecd2">권한 최소화</text>
    <rect x="870" y="548" width="240" height="52" rx="10" fill="#1f2a63" stroke="#c47f13" stroke-width="1.5"/>
    <text x="990" y="580" text-anchor="middle" font-size="17" font-weight="600" fill="#f0d3a0">관측성 · 롤백</text>
  </g>

  <!-- title -->
  <text x="90" y="70" font-family="'Segoe UI',sans-serif" font-size="34" font-weight="800" fill="#ffffff">데모는 되는데, 프로덕션에서 무너지는 이유</text>
  <text x="92" y="100" font-family="'Segoe UI',sans-serif" font-size="18" fill="#9aa4e0">AI 에이전트의 신뢰성 · 평가(evals) · 가드레일</text>

  <line x1="110" y1="295" x2="1090" y2="295" stroke="#c47f13" stroke-width="0" />
</svg>
