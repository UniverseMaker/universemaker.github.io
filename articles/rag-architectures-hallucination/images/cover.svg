<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="RAG 검색 아키텍처 4종과 환각 개념도">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1230"/>
      <stop offset="0.55" stop-color="#122048"/>
      <stop offset="1" stop-color="#1a2d78"/>
    </linearGradient>
    <linearGradient id="wire" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4f7bff"/>
      <stop offset="1" stop-color="#8ad8ff"/>
    </linearGradient>
    <radialGradient id="core" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#c8d2ff"/>
      <stop offset="0.5" stop-color="#5b74ff"/>
      <stop offset="1" stop-color="#2233c4"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>

  <!-- faint grid -->
  <g stroke="#3a4790" stroke-width="1" opacity="0.20">
    <path d="M0 112 H1200 M0 225 H1200 M0 337 H1200 M0 450 H1200 M0 562 H1200"/>
    <path d="M150 0 V675 M300 0 V675 M450 0 V675 M600 0 V675 M750 0 V675 M900 0 V675 M1050 0 V675"/>
  </g>

  <!-- wires from four retrieval satellites to the LLM core -->
  <g stroke="url(#wire)" stroke-width="3" fill="none" opacity="0.85">
    <path d="M600 337 C 430 210, 330 190, 215 180"/>
    <path d="M600 337 C 440 300, 340 315, 200 330"/>
    <path d="M600 337 C 430 470, 330 500, 215 505"/>
    <path d="M600 337 C 440 380, 330 415, 205 430"/>
  </g>

  <!-- four retrieval satellites (left) -->
  <g font-family="'Segoe UI',sans-serif" font-size="17" fill="#0a1230" text-anchor="middle" font-weight="600">
    <g><circle cx="175" cy="180" r="38" fill="#8ad8ff"/><text x="175" y="176">Lexical</text><text x="175" y="196" font-size="12">BM25</text></g>
    <g><circle cx="160" cy="330" r="38" fill="#8ad8ff"/><text x="160" y="326">Semantic</text><text x="160" y="346" font-size="12">Dense</text></g>
    <g><circle cx="165" cy="430" r="38" fill="#7ff0c0"/><text x="165" y="426">Hybrid</text><text x="165" y="446" font-size="12">RRF</text></g>
    <g><circle cx="175" cy="505" r="38" fill="#7ff0c0"/><text x="175" y="501">Graph</text><text x="175" y="521" font-size="12">KG</text></g>
  </g>

  <!-- central LLM core -->
  <circle cx="600" cy="337" r="120" fill="url(#core)" filter="url(#soft)" opacity="0.55"/>
  <circle cx="600" cy="337" r="98" fill="url(#core)" stroke="#dfe6ff" stroke-width="2"/>
  <text x="600" y="326" text-anchor="middle" font-family="'Segoe UI',sans-serif" font-size="46" font-weight="700" fill="#ffffff">RAG</text>
  <text x="600" y="362" text-anchor="middle" font-family="'Segoe UI',sans-serif" font-size="15" letter-spacing="2" fill="#cdd6ff">RETRIEVAL · LLM</text>

  <!-- grounded vs hallucination outputs (right) -->
  <g font-family="'Segoe UI',sans-serif" text-anchor="middle">
    <g stroke="url(#wire)" stroke-width="3" fill="none" opacity="0.85">
      <path d="M698 315 C 820 270, 900 250, 1000 240"/>
      <path d="M698 360 C 820 410, 900 435, 1000 445"/>
    </g>
    <g>
      <circle cx="1030" cy="240" r="42" fill="#7ff0c0"/>
      <text x="1030" y="236" font-size="15" font-weight="700" fill="#0a1230">근거 기반</text>
      <text x="1030" y="256" font-size="12" fill="#0a1230">grounded</text>
    </g>
    <g>
      <circle cx="1030" cy="445" r="42" fill="#ff9aa8"/>
      <text x="1030" y="441" font-size="15" font-weight="700" fill="#3a0710">환각</text>
      <text x="1030" y="461" font-size="12" fill="#3a0710">hallucination</text>
    </g>
  </g>

  <!-- title band -->
  <text x="600" y="606" text-anchor="middle" font-family="'Georgia',serif" font-size="33" font-weight="600" fill="#ffffff">검색이 지능을 구원하는 네 가지 방법</text>
  <text x="600" y="644" text-anchor="middle" font-family="'Segoe UI',sans-serif" font-size="16" letter-spacing="2.5" fill="#8ea2ff">LEXICAL · SEMANTIC · HYBRID · GRAPH RAG &amp; HALLUCINATION</text>
</svg>
